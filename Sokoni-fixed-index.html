<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sokoni – Buy &amp; sell locally</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f8ff;--card:#fff;--tx:#1b2140;--mu:#6b7394;--pr:#4f6bff;--pr2:#e8ecff;--bd:#e3e7f5}
@media (prefers-color-scheme:dark){:root{--bg:#12152b;--card:#1b1f3a;--tx:#eef0ff;--mu:#9aa2c9;--pr:#7b92ff;--pr2:#2a3060;--bd:#2b3157}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--pr);cursor:pointer;margin-right:auto}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--pr);color:#fff;cursor:pointer;font-weight:600}
button.sec{background:var(--pr2);color:var(--pr)}button.dan{background:#ffe9e5;color:#d6401f}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.bar input{flex:2;min-width:180px}.bar select{flex:1;min-width:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(79,107,255,.15)}
.img{aspect-ratio:4/3;background:var(--pr2) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px}
.in{padding:12px}.price{font-weight:800;color:var(--pr);font-size:18px}.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.t{font-weight:600;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
.detail{display:grid;gap:20px;grid-template-columns:1fr 1fr}@media(max-width:700px){.detail{grid-template-columns:1fr}}
.detail .img{border-radius:12px;aspect-ratio:1}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(10,14,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .panel{width:100%;max-width:460px;max-height:90vh;overflow:auto;margin:0}
.mu{color:var(--mu);font-size:14px}.empty{text-align:center;padding:48px 16px;color:var(--mu)}.er{color:#d6401f;font-size:14px}
.msg{border-top:1px solid var(--bd);padding:8px 0}h2{margin:0 0 12px}
.hero{background:linear-gradient(135deg,var(--pr),#7b5cff);color:#fff;border-radius:20px;padding:28px 20px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;opacity:.92}
.img{position:relative}.sold{position:absolute;top:8px;left:8px;background:#d6401f;color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:20px}
.heart{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:20px;background:var(--card);color:#ff4d6d;font-size:18px}
body{padding-bottom:76px}
:root[data-theme="light"]{--bg:#f6f8ff;--card:#fff;--tx:#1b2140;--mu:#6b7394;--pr:#4f6bff;--pr2:#e8ecff;--bd:#e3e7f5}
:root[data-theme="dark"]{--bg:#12152b;--card:#1b1f3a;--tx:#eef0ff;--mu:#9aa2c9;--pr:#7b92ff;--pr2:#2a3060;--bd:#2b3157}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;padding:8px 4px;font-size:12px}.tabs button.on{color:var(--pr)}.tabs span{display:block;font-size:20px}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bar input{grid-column:1/-1;min-width:0}.bar select{min-width:0;width:100%;text-overflow:ellipsis;padding-right:8px}
.hero-btn{margin-top:14px;background:#fff;color:#4f6bff;padding:11px 18px;border-radius:12px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card .in{padding:10px}.price{font-size:16px}}
.tabs{align-items:flex-end}.tabs button{padding:6px 2px 8px;font-size:11px;white-space:nowrap;min-width:0}
.tabs .post{color:var(--pr);font-weight:700}.tabs .post span{background:var(--pr);color:#fff;border-radius:50%;width:46px;height:46px;line-height:44px;margin:-22px auto 2px;font-size:28px;box-shadow:0 4px 12px rgba(79,107,255,.4)}
.tabs{padding-bottom:calc(50px + env(safe-area-inset-bottom,0px))}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.tabsx{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}.tabsx button{flex:0 0 auto;background:var(--pr2);color:var(--pr);border-radius:20px}.tabsx button.on{background:var(--pr);color:#fff}
.shipbtn{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{background:#17a673;color:#fff;font-weight:700;text-align:center;border-radius:12px;padding:9px;margin:4px 0 12px}
.snap{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.snap>div{flex:0 0 100%;scroll-snap-align:start;color:#fff;border-radius:16px;padding:22px 18px;cursor:pointer}
.mh{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mh>div{cursor:pointer}.sq{aspect-ratio:1;border-radius:12px;font-size:28px}
.qcart{position:absolute;right:8px;bottom:8px;padding:6px 10px;border-radius:50%;background:var(--pr);font-size:15px}
.pm{display:inline-block;border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;margin:3px 3px 0 0}.pm.off{opacity:.4}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats .panel{margin:0;cursor:pointer}
.snap .card{flex:0 0 110px;scroll-snap-align:start;color:var(--tx)}
main{padding-bottom:130px}
</style></head><body>
<header><div class="logo" onclick="go('')">🛍️ Sokoni</div><div id="nav" class="row"></div></header>
<nav class="tabs" id="tabs"></nav><main id="app"><div class="empty">Loading…</div></main>
<script>
// ====== PASTE YOUR SUPABASE VALUES HERE (Project Settings > API) ======
const SUPABASE_URL="https://cfksezuyfgcjbxrhahvz.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_0QJCOZiaLOFaQYNBtC4pbw_VtEmaF0V";
// =======================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const CITIES=["Kampala","Entebbe","Jinja","Bugiri","Mbarara","Gulu","Mbale","Masaka","Fort Portal"];const CONDS=["New","Like new","Good","Fair"];
const CATS=["Electronics","Furniture","Clothing","Books","Home & Garden","Sports","Toys","Vehicles","Beauty","Other"];
const S={user:null,listings:[],favs:new Set(),saved:false,city:"",q:"",cat:"",ready:false,err:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
var usd=n=>new Intl.NumberFormat("en-UG",{style:"currency",currency:"UGX",maximumFractionDigits:0}).format(n);
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const imgStyle=u=>safeUrl(u)?`style="background-image:url('${esc(encodeURI(safeUrl(u)))}')"`:"";
const go=h=>{location.hash=h};
const uname=()=>S.user?.user_metadata?.name||S.user?.email?.split("@")[0]||"User";

async function loadListings(){
  const {data,error}=await sb.from("listings").select("*").order("created_at",{ascending:false});
  if(error){S.err="Couldn’t load listings. Check your Supabase URL/key and that schema.sql was run."}else{S.listings=data;S.err=""}
  S.ready=true;render();
}
async function init(){
  const {data:{session}}=await sb.auth.getSession();S.user=session?.user||null;
  sb.auth.onAuthStateChange((_e,s)=>{clearInterval(S.poll);S.poll=null;S.user=s?.user||null;loadFavs()});
  await loadFavs();loadListings();
}
function nav(){tabs();
  $("#nav").innerHTML=S.user
   ?`<button onclick="openForm()">＋ Post Item</button><button class="sec" onclick="go('saved')">♥ Saved</button><button class="sec" onclick="go('dashboard')">My Listings</button><button class="sec" onclick="sb.auth.signOut();go('')">Log out</button>`
   :`<button class="sec" onclick="openAuth(false)">Log in</button><button onclick="openAuth(true)">Sign up</button>`;
}
function render(){
  nav();const h=location.hash.slice(1);
  if(!S.ready)return;
  if(S.err){$("#app").innerHTML=`<div class="empty">${esc(S.err)}</div>`;return}
  if(h==="categories")return cats();
  if(h==="cart")return cartPage();
  if(h==="settings")return settings();
  if(h.startsWith("item-"))return detail(h.slice(5));
  if(h==="dashboard")return dash();
  S.saved=h==="saved";home();
}
function home(){
  $("#app").innerHTML=`${S.saved?"<h2>♥ Saved items</h2>":"<div class=\"hero\"><h1>Great finds, right next door.</h1><p>Buy and sell pre-loved things with people in your city, all across Uganda.</p><button class=\"hero-btn\" onclick=\"openForm()\">＋ Sell an Item</button></div>"}<div class="bar"><input placeholder="Search items…" value="${esc(S.q)}" oninput="S.q=this.value;grid()"><select onchange="S.city=this.value;grid()"><option value="">All cities</option>${CITIES.map(c=>`<option ${S.city===c?"selected":""}>${c}</option>`).join("")}</select><select onchange="S.cat=this.value;grid()"><option value="">All categories</option>${CATS.map(c=>`<option ${S.cat===c?"selected":""}>${c}</option>`).join("")}</select></div><div id="g"></div>`;grid();
}
function grid(){
  const q=S.q.toLowerCase();
  const items=S.listings.filter(l=>(!S.saved||S.favs.has(l.id))&&(!S.city||String(l.city||"").toLowerCase()===S.city.toLowerCase())&&(!S.cat||l.category===S.cat)&&(!q||(l.title+" "+l.description).toLowerCase().includes(q)));
  $("#g").innerHTML=items.length?`<div class="grid">${items.map(card).join("")}</div>`:emptyHtml();
}
var card=l=>`<div class="card" onclick="go('item-${l.id}')"><div class="img" ${imgStyle(l.image_url)}>${safeUrl(l.image_url)?"":"No image"}${l.sold?'<span class="sold">SOLD</span>':""}<button class="heart" onclick="event.stopPropagation();fav('${l.id}')">${S.favs.has(l.id)?"♥":"♡"}</button></div><div class="in"><span class="tag">${esc(l.category)}</span><div class="t">${esc(l.title)}</div><div class="price">${usd(l.price)}</div><div class="mu">📍 ${esc(l.city||"")} · ${ago(l.created_at)}</div></div></div>`;
function detail(id){
  const l=S.listings.find(x=>x.id===id);
  if(!l){$("#app").innerHTML=`<div class="empty">Item not found.<br><br><button onclick="go('')">Back</button></div>`;return}
  const mine=S.user?.id===l.seller_id;
  $("#app").innerHTML=`<button class="sec" onclick="go('')">← Back</button><div class="panel detail" style="margin-top:12px"><div class="img" ${imgStyle(l.image_url)}>${safeUrl(l.image_url)?"":"No image"}</div><div><span class="tag">${esc(l.category)}</span>${l.condition?` <span class="tag">${esc(l.condition)}</span>`:""}<h2 style="margin-top:8px">${esc(l.title)}</h2><div class="price" style="font-size:28px">${usd(l.price)}</div><p style="white-space:pre-wrap">${esc(l.description)}</p><p class="mu">📍 ${esc(loc(l))}</p><p class="mu">Seller: ${esc(l.seller_name)} · ${new Date(l.created_at).toLocaleDateString("en-US")}</p>${mine?`<button class="sec" onclick="go('dashboard')">Manage in My Listings</button>`:l.sold?`<b>This item has been sold.</b>`:`<button onclick="openMsg('${l.id}')">💬 Message seller</button> <button class="sec" onclick="addCart('${l.id}')">${S.cart.includes(l.id)?"✓ In cart":"🛒 Add to cart"}</button> <button class="sec" onclick="fav('${l.id}')">${S.favs.has(l.id)?"♥ Saved":"♡ Save"}</button>`}</div></div>`;
}
async function dash(){
  if(!S.user){$("#app").innerHTML=`<div class="empty">Log in to see your listings.<br><br><button onclick="openAuth(false)">Log in</button></div>`;return}
  const mine=S.listings.filter(l=>l.seller_id===S.user.id);
  const {data:inbox}=await sb.from("messages").select("*").eq("seller_id",S.user.id).order("created_at",{ascending:false});
  $("#app").innerHTML=`<h2>My Listings</h2>${mine.length?`<div class="grid">${mine.map(l=>`<div class="card" style="cursor:default"><div class="img" ${imgStyle(l.image_url)} onclick="go('item-${l.id}')">${safeUrl(l.image_url)?"":"No image"}</div><div class="in"><span class="tag">${esc(l.category)}</span><div class="t">${esc(l.title)}</div><div class="price">${usd(l.price)}</div><div class="row" style="margin-top:8px"><button class="sec" onclick="openForm('${l.id}')">Edit</button><button class="sec" onclick="toggleSold('${l.id}',${!l.sold})">${l.sold?"Relist":"Mark sold"}</button><button class="dan" onclick="del('${l.id}')">Delete</button></div></div></div>`).join("")}</div>`:`<div class="empty">You haven’t posted anything yet.<br><br><button onclick="openForm()">＋ Post Item</button></div>`}<h2 style="margin-top:28px">Messages</h2><div class="panel">${inbox?.length?inbox.map(m=>`<div class="msg"><b>${esc(m.from_name)}</b> <span class="mu">about “${esc(m.listing_title)}” · ${new Date(m.created_at).toLocaleString("en-US")}</span><div style="white-space:pre-wrap">${esc(m.body)}</div></div>`).join(""):`<span class="mu">No messages yet.</span>`}</div>`;
}
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="panel">${html}</div>`;m.addEventListener("click",e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function openAuth(up){
  const m=modal(`<h2>${up?"Create your account":"Welcome back"}</h2>${up?`<label>Display name</label><input id="nm" maxlength="40">`:""}<label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" minlength="6" autocomplete="${up?"new-password":"current-password"}"><div id="er" class="er"></div><div class="row" style="margin-top:14px"><button id="ok">${up?"Sign up":"Log in"}</button><button class="sec" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  const v=s=>m.querySelector(s)?.value.trim(),er=t=>m.querySelector("#er").textContent=t;
  m.querySelector("#ok").onclick=async()=>{
    const email=v("#em"),password=m.querySelector("#pw").value;
    if(!email||password.length<6)return er("Enter your email and a password (6+ characters).");
    if(up&&!v("#nm"))return er("Please choose a display name.");
    const r=up?await sb.auth.signUp({email,password,options:{data:{name:v("#nm")}}}):await sb.auth.signInWithPassword({email,password});
    if(r.error)return er(r.error.message);
    if(up&&!r.data.session)return m.querySelector(".panel").innerHTML=`<h2>Check your email</h2><p>We sent a confirmation link to ${esc(email)}. Click it, then log in.</p><button onclick="this.closest('.modal').remove()">OK</button>`;
    m.remove();
  };
}
function openForm(id){
  if(!S.user)return openAuth(false);
  const l=id?S.listings.find(x=>x.id===id):{};
  const cities=[...new Set([...CITIES,...(l.city?[l.city]:[])])];
  const m=modal(`<h2>${id?"Edit item":"Create listing"}</h2><label>Title</label><input id="ft" maxlength="80" value="${esc(l.title||"")}"><label>Price (UGX)</label><input id="fp" type="number" inputmode="numeric" min="0" step="500" value="${l.price??""}"><label>Category</label><select id="fc">${CATS.map(c=>`<option ${l.category===c?"selected":""}>${c}</option>`).join("")}</select><label>City / Location</label><select id="fcity">${cities.map(c=>`<option ${l.city===c?"selected":""}>${c}</option>`).join("")}</select><label>Condition</label><select id="fcond">${CONDS.map(c=>`<option ${l.condition===c?"selected":""}>${c}</option>`).join("")}</select><label>Description</label><textarea id="fd" rows="4" maxlength="1500">${esc(l.description||"")}</textarea><label>Photo ${id?"(leave empty to keep current)":""}</label><input id="fimg" type="file" accept="image/*"><div id="er" class="er"></div><div class="row" style="margin-top:14px"><button id="ok">${id?"Save changes":"Publish"}</button><button class="sec" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  const v=s=>m.querySelector(s).value.trim(),er=t=>m.querySelector("#er").textContent=t;
  m.querySelector("#ok").onclick=async e=>{
    const btn=e.target,price=Math.round(parseFloat(v("#fp"))),file=m.querySelector("#fimg").files[0];
    if(!v("#ft"))return er("Please add a title.");
    if(!(price>=0))return er("Enter a valid price in UGX.");
    btn.disabled=true;btn.textContent="Saving…";er("");
    try{
      const row={title:v("#ft"),category:v("#fc"),price,city:v("#fcity"),country:"Uganda",condition:v("#fcond"),description:v("#fd"),image_url:l.image_url||""};
      if(file)row.image_url=await uploadImg(file);
      const {error}=id?await sb.from("listings").update(row).eq("id",id):await sb.from("listings").insert({...row,seller_name:uname()});
      if(error)throw error;
      m.remove();loadListings();
    }catch(x){er(x.message||"Couldn’t save. Did you run update2.sql?");btn.disabled=false;btn.textContent=id?"Save changes":"Publish"}
  };
}
async function uploadImg(file){
  const bmp=await createImageBitmap(file),k=Math.min(1,1000/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82)),path=`${S.user.id}/${Date.now()}.jpg`;
  const {error}=await sb.storage.from("listing-images").upload(path,blob,{contentType:"image/jpeg"});
  if(error)throw error;
  return sb.storage.from("listing-images").getPublicUrl(path).data.publicUrl;
}
const ago=t=>{const m=Math.floor((Date.now()-new Date(t))/6e4);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.floor(m/60);if(h<24)return h+"h ago";const d=Math.floor(h/24);return d<30?d+"d ago":new Date(t).toLocaleDateString("en-GB")};
const SAMPLES=[["📱","Samsung Galaxy A14",450000,"Kampala","2h ago","Good","#dfe6ff"],["🛋️","3-seater sofa",600000,"Jinja","5h ago","Like new","#ffe8df"],["🚲","City bicycle",180000,"Bugiri","1d ago","Good","#dff7ea"],["💻","HP laptop 8GB RAM",900000,"Kampala","1d ago","Good","#efe3ff"],["📚","Secondary school books",40000,"Entebbe","3d ago","Fair","#fff5d6"],["👟","Running shoes size 42",70000,"Mbarara","4d ago","New","#dff3ff"]];
function emptyHtml(){
  if(S.listings.length)return `<div class="empty">No items match your filters.</div>`;
  return `<div class="empty">No listings yet — be the first to post!<br><br><button onclick="openForm()">＋ Post Your First Item</button></div><h3 style="margin:8px 0">Preview: how listings will look</h3><div class="grid">${SAMPLES.map(([e,t,p,c,a,cd,bg])=>`<div class="card" style="cursor:default"><div class="img" style="background:${bg};font-size:48px">${e}<span class="sold" style="background:#6b7394">SAMPLE</span></div><div class="in"><span class="tag">${cd}</span><div class="t">${t}</div><div class="price">${usd(p)}</div><div class="mu">📍 ${c} · ${a}</div></div></div>`).join("")}</div>`;
}
async function del(id){
  if(!confirm("Delete this listing?"))return;
  const {error}=await sb.from("listings").delete().eq("id",id);
  if(error)alert(error.message);else loadListings();
}
function openMsg(id){
  if(!S.user)return openAuth(false);
  const l=S.listings.find(x=>x.id===id);
  const m=modal(`<h2>Message ${esc(l.seller_name)}</h2><p class="mu">About “${esc(l.title)}” · ${usd(l.price)}</p><textarea id="tx" rows="4" maxlength="800" placeholder="Hi! Is this still available?"></textarea><div id="er" class="er"></div><div class="row" style="margin-top:14px"><button id="ok">Send</button><button class="sec" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  m.querySelector("#ok").onclick=async()=>{
    const body=m.querySelector("#tx").value.trim();if(!body)return;
    const {error}=await sb.from("messages").insert({listing_id:id,listing_title:l.title,seller_id:l.seller_id,from_name:uname(),body});
    if(error)return m.querySelector("#er").textContent=error.message;
    m.querySelector(".panel").innerHTML=`<h2>Sent ✓</h2><p>${esc(l.seller_name)} will see it in their dashboard.</p><button onclick="this.closest('.modal').remove()">Done</button>`;
  };
}
const loc=l=>[l.city,l.country].filter(Boolean).join(", ")||"Location not set";
async function loadFavs(){
  if(!S.user){S.favs=new Set()}else{const {data}=await sb.from("favorites").select("listing_id");S.favs=new Set((data||[]).map(r=>r.listing_id))}
  render();
}
async function fav(id){
  if(!S.user)return openAuth(false);
  if(S.favs.has(id)){S.favs.delete(id);await sb.from("favorites").delete().eq("listing_id",id)}
  else{S.favs.add(id);await sb.from("favorites").insert({listing_id:id})}
  render();
}
async function toggleSold(id,sold){
  const {error}=await sb.from("listings").update({sold}).eq("id",id);

async function loadFavs(){
  if(!S.user){S.favs=new Set();S.cartRows=[];S.cart=[]}else{
    sb.from("profiles").upsert({id:S.user.id,name:uname()});
    const [f,c]=await Promise.all([sb.from("favorites").select("listing_id"),sb.from("cart_items").select("listing_id,qty")]);
    S.favs=new Set((f.data||[]).map(r=>r.listing_id));S.cartRows=c.data||[];S.cart=S.cartRows.map(r=>r.listing_id);
  }
  render();
}
async function addCart(id,qty=1){
  if(!S.user)return openAuth(false);
  const r=S.cartRows.find(x=>x.listing_id===id);
  await sb.from("cart_items").upsert({user_id:S.user.id,listing_id:id,qty:(r?r.qty:0)+qty});await loadFavs();
}
async function setQty(id,q){if(q<1)return rmCart(id);await sb.from("cart_items").update({qty:q}).eq("listing_id",id);loadFavs()}
async function rmCart(id){await sb.from("cart_items").delete().eq("listing_id",id);loadFavs()}
async function buyNow(id){if(!S.user)return openAuth(false);await addCart(id);go("checkout")}
function calc(){
  const pct=S.promo?.percent||0;
  const lines=S.cartRows.map(r=>({l:S.listings.find(x=>x.id===r.listing_id),q:r.qty})).filter(x=>x.l&&!x.l.sold);
  lines.forEach(x=>{x.sub=unit(x.l,x.q)*x.q;x.disc=Math.round(x.sub*pct)/100;x.ship=Number(x.l.shipping_fee)||0;x.total=+(x.sub-x.disc+x.ship).toFixed(2)});
  const sum=k=>lines.reduce((a,x)=>a+x[k],0);
  return {lines,sub:sum("sub"),disc:sum("disc"),ship:sum("ship"),total:sum("total")};
}
const rw=(a,b)=>`<div class="row" style="justify-content:space-between"><span>${a}</span><span>${b}</span></div>`;
const sumHtml=c=>rw("Items",usd(c.sub))+(c.disc?rw("Promo","−"+usd(c.disc)):"")+rw("Shipping",c.ship?usd(c.ship):"Free")+`<div class="row" style="justify-content:space-between"><b>Total (USD)</b><b class="price">${usd(c.total)}</b></div>`;
function cartPage(){
  if(!S.user)return login();
  const c=calc();
  $("#app").innerHTML=`<h2>🛒 Your cart</h2>${c.lines.length?c.lines.map(({l,q})=>`<div class="panel row" style="margin-bottom:10px"><div class="img" style="width:72px;height:72px;aspect-ratio:auto;border-radius:10px" ${imgStyle(l.image_url)}></div><div style="flex:1;min-width:130px"><div class="t">${esc(l.title)}</div><div class="price">${usd(unit(l,q))} each</div>${l.bulk_min&&q<l.bulk_min?`<div class="mu">Buy ${l.bulk_min}+ for ${usd(l.bulk_price)} each</div>`:""}</div><div class="row"><button class="sec" onclick="setQty('${l.id}',${q-1})">−</button><b>${q}</b><button class="sec" onclick="setQty('${l.id}',${q+1})">＋</button></div><button class="dan" onclick="rmCart('${l.id}')">✕</button></div>`).join("")+`<div class="panel"><div class="row"><input id="pc" placeholder="Promo code" style="flex:1" value="${esc(S.promo?.code||"")}"><button class="sec" onclick="applyPromo()">Apply</button></div><div id="pm" class="er"></div>${sumHtml(c)}<button style="width:100%;margin-top:12px" onclick="go('checkout')">Checkout</button></div>`:`<div class="empty">Your cart is empty.<br><br><button onclick="go('')">Browse items</button></div>`}`;
}
async function applyPromo(){
  const code=$("#pc").value.trim().toUpperCase();if(!code){S.promo=null;return render()}
  const {data}=await sb.from("promos").select("*").eq("code",code).eq("active",true).maybeSingle();
  if(data){S.promo=data;render()}else{S.promo=null;$("#pm").textContent="Invalid promo code."}
}
function checkout(){
  if(!S.user)return login();
  const c=calc();if(!c.lines.length)return go("cart");
  $("#app").innerHTML=`<h2>Checkout</h2>${shield()}<div class="panel"><b>Shipping address</b><textarea id="addr" rows="3" placeholder="Full name, street, city, country"></textarea></div><div class="panel"><b>Order summary</b>${c.lines.map(({l,q})=>rw(esc(l.title)+" × "+q,usd(unit(l,q)*q))).join("")}${sumHtml(c)}<div id="er" class="er"></div><button style="width:100%;margin-top:12px" id="pay" onclick="pay()">Pay ${usd(c.total)} by card</button><button class="sec" style="width:100%;margin-top:8px" disabled>PayPal — coming soon</button><p class="mu">Card payments are processed by Stripe. Sellers pay Sokoni a 10% commission.</p></div>`;
}
async function pay(){
  const er=$("#er"),btn=$("#pay"),addr=$("#addr").value.trim();
  if(addr.length<10)return er.textContent="Please enter your shipping address.";
  btn.disabled=true;btn.textContent="Processing…";er.textContent="";
  const ids=[];
  for(const {l,q,sub,disc,ship,total} of calc().lines){
    const comm=+(total*FEE).toFixed(2);
    const {data,error}=await sb.from("orders").insert({seller_id:l.seller_id,listing_id:l.id,title:l.title,qty:q,item_total:sub,shipping:ship,discount:disc,total,commission:comm,seller_payout:+(total-comm).toFixed(2),ship_address:addr,promo_code:S.promo?.code||null}).select("id").single();
    if(error){er.textContent=error.message;btn.disabled=false;btn.textContent="Try again";return}
    ids.push(data.id);
  }
  const {data,error}=await sb.functions.invoke("create-checkout",{body:{order_ids:ids}});
  if(error||!data?.url){er.innerHTML="Card payments aren’t connected yet. Your order was saved as <b>Pending payment</b> in My Orders.";btn.disabled=false;btn.textContent="Try again";return}
  location.href=data.url;
}
const receipt=o=>`<div class="msg"><b>${esc(o.title)}</b> × ${o.qty} <span class="tag">${esc(o.status)}</span><div class="mu">Order #${o.id.slice(0,8)} · ${new Date(o.created_at).toLocaleString("en-US")}</div><div>Items ${usd(o.item_total)} · Shipping ${usd(o.shipping)}${Number(o.discount)>0?` · Promo −${usd(o.discount)}`:""}</div><b>Total ${usd(o.total)}</b></div>`;
async function paid(){
  if(!S.user)return login();
  const {data}=await sb.from("orders").select("*").eq("buyer_id",S.user.id).gte("created_at",new Date(Date.now()-2*3600e3).toISOString()).order("created_at",{ascending:false});
  const ok=(data||[]).filter(o=>o.status!=="Pending payment");
  if(ok.length&&S.cartRows.length){await sb.from("cart_items").delete().eq("user_id",S.user.id);S.cartRows=[];S.cart=[];tabs()}
  $("#app").innerHTML=ok.length?`<div class="panel"><h2>✅ Payment confirmed</h2>${ok.map(receipt).join("")}<button onclick="go('orders')">View my orders</button></div>`:`<div class="panel"><h2>Confirming your payment…</h2><p class="mu">This usually takes a few seconds.</p><button onclick="paid()">Refresh</button></div>`;
}
async function ordersPage(){
  if(!S.user)return login();
  const {data}=await sb.from("orders").select("*").order("created_at",{ascending:false}),all=data||[];

const closeP=()=>{document.querySelectorAll(".modal").forEach(m=>m.remove());if(S.pg){S.pg.bg.id="app";S.pg=null}};

function openPage(fn){

const ownErr=e=>alert(e.message+(/policy|permission|row-level|admin|owner/i.test(e.message)?"\n\nYour account must be marked as owner in the database. Run the owner SQL, then log out and back in.":""));
function openOwner(tab){
  closeP();tab=tab||"pay";
  const T=[["pay","Payments"],["wd","Withdrawals"],["list","Listings"],["stats","Stats &amp; Codes"]];
  const m=document.createElement("div");m.className="modal";m.style.cssText="padding:0;align-items:stretch;background:var(--bg)";
  m.innerHTML=`<div class="panel" style="max-width:none;max-height:none;height:100%;border-radius:0;margin:0;overflow:auto;padding:14px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">👑 Owner Control Panel</h2><button class="sec" onclick="closeP()">✕ Close</button></div><div id="ostat" class="mu" style="margin-top:10px">Checking owner access…</div><div class="tabsx" style="margin-top:12px">${T.map(([k,n])=>`<button class="${k===tab?"on":""}" onclick="openOwner('${k}')">${n}</button>`).join("")}</div><div id="otab"><div class="mu">Loading…</div></div></div>`;
  document.body.appendChild(m);ownTab(tab);ownDiag();
}
async function ownDiag(){
  let h;
  try{
    const {data,error}=await sb.from("profiles").select("id,is_admin").eq("id",S.user.id).maybeSingle();
    if(error)h=`<div class="panel" style="background:#ffe9e5;color:#8a2a12">❌ Database error: ${esc(error.message)}<br>The database setup hasn’t fully run yet.</div>`;
    else if(!data)h=`<div class="panel" style="background:#fff3d6;color:#7a5a00">⚠️ No profile row found for ${esc(S.user.email)}. Log out and back in once, then run the owner SQL.</div>`;
    else if(!data.is_admin)h=`<div class="panel" style="background:#fff3d6;color:#7a5a00">⚠️ Your profile exists but is not marked owner. Run the owner SQL, then log out and back in.</div>`;
    else{S.isAdmin=true;h=`<div class="panel" style="background:#dff7ea;color:#0d6b49">✔ Owner access confirmed</div>`}
  }catch(e){h=`<div class="panel" style="background:#ffe9e5;color:#8a2a12">❌ ${esc(e.message)}</div>`}
  const e=document.getElementById("ostat");if(e)e.innerHTML=h;
}
async function ownTab(tab){
  const q=async t=>{try{return (await t).data||[]}catch(e){return[]}};
  const pf=await q(sb.from("profiles").select("id,name")),nm=Object.fromEntries(pf.map(p=>[p.id,p.name])),who=id=>esc(nm[id]||String(id).slice(0,8));
  let h="";
  if(tab==="pay"){
    const [pay,o]=await Promise.all([q(sb.from("payments").select("*").eq("status","Pending").order("created_at",{ascending:false})),q(sb.from("orders").select("id,title,qty"))]);
    const label=p=>p.kind==="order"?"Order: "+(p.order_ids||[]).map(id=>{const x=o.find(z=>z.id===id);return x?x.title+" ×"+x.qty:""}).join(", "):{pro:"Sokoni Pro",boost:"Boost",gift:"Gift card $"+p.gift_amount}[p.kind];
    h=`<b>Pending payments (${pay.length})</b>`+(pay.map(p=>`<div class="panel" style="margin-top:10px"><b>${usd(p.amount)}</b> · ${esc(label(p))}<div class="mu">From ${who(p.user_id)} · ${esc(p.method)}</div><div>Receipt ID: <b>${esc(p.txn_id)}</b></div><div class="row" style="margin-top:8px"><button onclick="ownApprove('${p.id}')">✅ Approve</button><button class="dan" onclick="ownReject('${p.id}')">❌ Reject</button></div></div>`).join("")||`<p class="mu">Nothing waiting.</p>`)+`<p class="mu">Approve only after the money has reached your MoMo, wallet or crypto address. Approving unlocks the buyer’s Pro plan, Boost, gift card or book.</p>`;
  }else if(tab==="wd"){
    const w=await q(sb.from("withdrawals").select("*").order("created_at",{ascending:false}));
    h=`<b>Withdrawal requests (${w.length})</b>`+(w.map(x=>`<div class="panel" style="margin-top:10px"><b>${usd(x.amount)}</b> · ${who(x.user_id)} · <span class="tag">${esc(x.status)}</span><div class="mu">${esc(x.method)}</div><div class="mu" style="white-space:pre-wrap">${esc(x.details)}</div>${x.status==="Pending"?`<button style="margin-top:8px" onclick="ownPaid('${x.id}')">💸 Mark Paid</button>`:""}</div>`).join("")||`<p class="mu">No requests.</p>`);
  }else if(tab==="list"){
    h=`<b>All listings (${S.listings.length})</b>`+(S.listings.map(l=>`<div class="panel" style="margin-top:10px"><b>${esc(l.title)}</b><div class="mu">${esc(l.seller_name)} · ${usd(l.price)}</div><div class="row" style="margin-top:8px"><button class="${isBoost(l)?"":"sec"}" onclick="ownL('${l.id}',{boosted_until:${isBoost(l)?"null":`'${new Date(Date.now()+7*864e5).toISOString()}'`}})">🔥 ${isBoost(l)?"Unpin":"Pin"} First-Seen</button><button class="dan" onclick="ownDel('${l.id}')">🗑️ Delete</button></div></div>`).join("")||`<p class="mu">No listings.</p>`);
  }else{
    const [o,inc,gc]=await Promise.all([q(sb.from("orders").select("commission,status")),q(sb.from("platform_income").select("amount")),q(sb.from("gift_cards").select("*").order("created_at",{ascending:false}).limit(10))]);
    const rev=o.filter(x=>x.status!=="Pending payment").reduce((a,x)=>a+Number(x.commission),0)+inc.reduce((a,i)=>a+Number(i.amount),0);
    h=`<div class="stats"><div class="panel"><div class="mu">Total USD revenue</div><div class="price">${usd(rev)}</div></div><div class="panel"><div class="mu">Total users</div><div class="price">${pf.length}</div></div></div><div class="panel"><b>Create a Gift Card code</b><div class="row" style="margin:8px 0">${[10,25,50,100].map(a=>`<button class="sec" onclick="ownGift(${a})">+ $${a}</button>`).join("")}</div>${gc.map(g=>`<div class="msg"><b>${esc(g.code)}</b> $${g.amount} ${g.redeemed_by?"· used":"· unused"} ${g.redeemed_by?"":cpBtn(g.code)}</div>`).join("")}</div>`;
  }
  const e=document.getElementById("otab");if(e)e.innerHTML=h;
}

async function ownL(id,p){const {error}=await sb.from("listings").update(p).eq("id",id);if(error)return ownErr(error);await loadListings();openOwner("list")}

async function ownGift(a){const code=("SK"+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6)).toUpperCase();const {error}=await sb.from("gift_cards").insert({code,amount:a});if(error)return ownErr(error);alert("New $"+a+" gift card code:\n"+code);openOwner("stats")}
async function openSpin(){
  closeP();const q=async t=>{try{return (await t).data||[]}catch(e){return[]}},H=864e5;
  const [ck,sp]=await Promise.all([q(sb.from("rewards_log").select("*").eq("kind","checkin").order("created_at",{ascending:false}).limit(1)),q(sb.from("rewards_log").select("*").eq("kind","spin").order("created_at",{ascending:false}).limit(1))]);
  const lc=ck[0],streak=lc&&Date.now()-new Date(lc.created_at)<2*H?Number(lc.prize)||0:0,canC=!lc||Date.now()-new Date(lc.created_at)>=H,canS=!sp[0]||Date.now()-new Date(sp[0].created_at)>=H;
  modal(`<h2>🎰 Daily Rewards &amp; Spin</h2><div class="row" style="margin:10px 0">${[1,2,3,4,5,6,7].map(k=>`<span class="tag" style="${k<=streak?"background:var(--pr);color:#fff":""}">Day ${k}</span>`).join("")}</div><button ${canC?"":"disabled"} onclick="checkin2()">${canC?"Check In Today":"Checked in ✔"}</button><div id="wh" style="width:130px;height:130px;border-radius:50%;margin:14px auto 4px;border:4px solid var(--pr);background:conic-gradient(#ff7a59 0 20%,#4f6bff 0 40%,#17a673 0 60%,#f5a623 0 80%,#ff4d6d 0 100%);transition:transform 2.5s cubic-bezier(.2,.8,.2,1)"></div><div style="text-align:center">▲</div><button id="spb" style="width:100%" ${canS?"":"disabled"} onclick="spin2()">${canS?"Spin to Win (1 free spin today)":"Next free spin tomorrow"}</button><p class="mu">Prizes: $0.50 or $1.00 credit, 10% or 15% coupons, or a Free Boost.</p><button class="sec" onclick="closeP()">Close</button>`);
}

async function spin2(){

async function getAvail(){
  const me=S.user.id,q=async t=>{try{return (await t).data||[]}catch(e){return[]}};
  const [oo,wd]=await Promise.all([q(sb.from("orders").select("seller_payout,seller_id,status")),q(sb.from("withdrawals").select("*").order("created_at",{ascending:false}))]);
  const earned=oo.filter(o=>o.seller_id===me&&o.status==="Delivered").reduce((a,o)=>a+Number(o.seller_payout),0),mine=wd.filter(w=>w.user_id===me),taken=mine.filter(w=>w.status!=="Rejected").reduce((a,w)=>a+Number(w.amount),0);
  return {avail:Math.max(0,earned-taken),wd:mine};
}

  closeP();let avail=0,wd=[];try{const a=await getAvail();avail=a.avail;wd=a.wd}catch(e){}

  modal(`<h2>⚙️ Account</h2><p class="mu">${esc(S.user.email)}</p><label>Display name</label><input id="sn" maxlength="40" value="${esc(uname())}"><div id="sm" class="mu"></div><button style="margin-top:8px" onclick="saveName()">Save name</button><b style="display:block;margin-top:14px">📍 Saved addresses <button class="sec" style="padding:4px 10px" onclick="addAddr2()">＋ Add</button></b>${ad.map((a,i)=>`<div class="msg row" style="justify-content:space-between"><span style="white-space:pre-wrap">${esc(a)}</span><button class="dan" onclick="delAddr2(${i})">✕</button></div>`).join("")||`<p class="mu">No saved addresses.</p>`}<label>Theme</label><select onchange="setTheme(this.value)">${["auto","light","dark"].map(t=>`<option value="${t}" ${th===t?"selected":""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select><div class="row" style="margin-top:14px"><button class="sec" onclick="closeP();go('support')">🎧 Help</button><button class="sec" onclick="sb.auth.signOut();closeP();go('')">Log out</button><button class="sec" onclick="closeP()">Close</button></div>`);
}
function addAddr2(){const m=modal(`<h2>Add address</h2><textarea id="aa" rows="3" placeholder="Full name, street, city, country"></textarea><div id="aaerr" class="er"></div><div class="row" style="margin-top:12px"><button id="ok">Save address</button><button class="sec" onclick="this.closest('.modal').remove()">Cancel</button></div>`);m.querySelector("#ok").onclick=async()=>{const t=m.querySelector("#aa").value.trim(),e=m.querySelector("#aaerr"),b=m.querySelector("#ok");if(t.length<10){e.textContent="Please enter a complete address.";return}b.disabled=true;b.textContent="Saving…";try{const a=await getAddrs();if(a.includes(t)){e.textContent="That address is already saved.";b.disabled=false;b.textContent="Save address";return}a.push(t);await saveAddrs(a);openAccount()}catch(x){e.textContent=x.message||"Could not save the address. Please try again.";b.disabled=false;b.textContent="Save address"}}}
