<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokoni Marketplace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --pr: #17a673; --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --border: #30363d; }
    [data-theme="light"] { --bg: #f6f8fa; --card: #ffffff; --text: #24292e; --border: #e1e4e8; }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    button { background: var(--pr); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button.sec { background: var(--border); color: var(--text); }
    button.dan { background: #f85149; color: #fff; }
    input, select, textarea { width: 100%; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; margin: 6px 0 12px 0; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .msg { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .mu { color: #8b949e; font-size: 13px; }
    .price { font-weight: 800; color: var(--pr); }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; background: rgba(23,166,115,0.15); color: var(--pr); font-weight: 600; }
    #app { max-width: 600px; margin: 0 auto; padding: 16px; padding-bottom: 85px; }
    nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
    nav button { background: none; color: var(--text); font-size: 11px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    nav button.active { color: var(--pr); }
  </style>
</head>
<body>

  <div id="app"></div>

  <nav>
    <button id="nav-home" onclick="go('home')">🏠<span>Home</span></button>
    <button id="nav-categories" onclick="go('categories')">📂<span>Categories</span></button>
    <button id="nav-post" onclick="go('post')">➕<span>Post</span></button>
    <button id="nav-cart" onclick="go('cart')">🛒<span>Cart</span></button>
    <button id="nav-settings" onclick="go('settings')">⚙️<span>Settings</span></button>
  </nav>

<script>
  // 1. SUPABASE CONFIGURATION (Replace with your Supabase Project URL and Anon Key)
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const sb = (SUPABASE_URL !== "YOUR_SUPABASE_URL") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  let S = { user: null, listings: [], cart: [], credit: 0.60, page: "settings" };

  const $ = s => document.querySelector(s);
  function usd(n) { return "$" + Number(n || 0).toFixed(2); }
  function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function uname() { return S.user?.user_metadata?.full_name || S.user?.email?.split("@")[0] || "Sokoni Member"; }

  function modal(html) {
    closeP();
    let m = document.createElement("div");
    m.className = "sokoni-modal";
    m.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:15px;";
    m.innerHTML = `<div style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;width:100%;max-width:400px;padding:20px;max-height:90vh;overflow-y:auto">${html}</div>`;
    document.body.appendChild(m);
    return m;
  }
  function closeP() { document.querySelectorAll(".sokoni-modal").forEach(el => el.remove()); }
  function toast(msg) {
    let t = document.createElement("div");
    t.style.cssText = "position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#17a673;color:#fff;padding:8px 16px;border-radius:20px;z-index:10000;font-weight:600;font-size:13px;";
    t.innerText = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  async function init() {
    const savedTheme = localStorage.getItem("sokoni-theme") || "dark";
    document.documentElement.dataset.theme = savedTheme;
    if (sb) {
      try {
        const { data: { session } } = await sb.auth.getSession();
        S.user = session?.user || null;
        await loadListings();
      } catch (e) { console.error(e); }
    } else {
      S.user = { id: "demo-user", email: "member@sokoni.app" };
    }
    const savedCredit = localStorage.getItem("sokoni_credit_" + (S.user?.id || "guest"));
    if (savedCredit !== null) S.credit = parseFloat(savedCredit) || 0.60;
    go(S.page);
  }

  function saveCredit() {
    localStorage.setItem("sokoni_credit_" + (S.user?.id || "guest"), S.credit.toFixed(2));
  }

  async function loadListings() {
    if (!sb) return;
    const { data } = await sb.from("listings").select("*").order("created_at", { ascending: false });
    S.listings = data || [];
  }

  function go(page) {
    S.page = page;
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    const btn = document.getElementById("nav-" + page);
    if (btn) btn.classList.add("active");
    if (page === "home") renderHome();
    else if (page === "categories") renderCategories();
    else if (page === "post") renderPost();
    else if (page === "cart") renderCart();
    else if (page === "settings") renderSettings();
  }

  function renderHome() {
    $("#app").innerHTML = `<h2>🏠 Home</h2><p class="mu">Welcome to Sokoni Marketplace.</p>`;
  }
  function renderCategories() {
    $("#app").innerHTML = `<h2>📂 Categories</h2><p class="mu">Browse marketplace categories.</p>`;
  }
  function renderPost() {
    $("#app").innerHTML = `<h2>➕ Post Listing</h2><div class="panel"><label>Title</label><input id="ltitle" placeholder="Item name"><label>Price ($)</label><input id="lprice" type="number" placeholder="10.00"><button style="width:100%" onclick="toast('Listing created ✔');go('settings')">Publish</button></div>`;
  }
  function renderCart() {
    $("#app").innerHTML = `<h2>🛒 Cart</h2><p class="mu">Your cart is empty.</p>`;
  }

  function withdrawNow() {
    modal(`<h2>💸 Withdraw Funds</h2>
      <p class="mu">Available balance: <b>${usd(S.credit)}</b></p>
      <label>Withdrawal Method</label>
      <select id="wmethod"><option>Mobile Money (MoMo)</option><option>Bank Transfer</option><option>Crypto (USDT)</option></select>
      <label>Account / Address Details</label>
      <input id="wdet" placeholder="Phone number or wallet address">
      <div id="werr" class="mu" style="color:#f85149;margin-bottom:8px"></div>
      <div class="row" style="margin-top:12px">
        <button id="wbtn" style="flex:1">Confirm Withdrawal</button>
        <button class="sec" onclick="closeP()">Cancel</button>
      </div>`);
    $("#wbtn").onclick = () => {
      if (!$("#wdet").value.trim()) { $("#werr").innerText = "Please enter account details."; return; }
      toast("Withdrawal requested successfully ✔");
      closeP();
    };
  }

  function openSpin() {
    const today = new Date().toDateString();
    const spinKey = "sokoni_spin_" + (S.user?.id || "guest");
    const alreadySpun = localStorage.getItem(spinKey) === today;

    modal(`<h2>🎰 Daily Rewards &amp; Spin</h2>
      <p class="mu">Spin once every 24 hours to win credits or coupons!</p>
      <div style="text-align:center;padding:20px;font-size:36px">🎁</div>
      <div id="spin-msg" class="mu" style="text-align:center;margin-bottom:10px;color:#f85149">${alreadySpun ? "You already claimed today's spin. Come back tomorrow!" : ""}</div>
      <button id="spin-btn" style="width:100%" ${alreadySpun ? "disabled style='width:100%;opacity:0.5;cursor:not-allowed'" : ""}>Spin Now</button>
      <button class="sec" style="width:100%;margin-top:8px" onclick="closeP()">Close</button>`);

    if (!alreadySpun) {
      $("#spin-btn").onclick = () => {
        localStorage.setItem(spinKey, today);
        S.credit += 0.50;
        saveCredit();
        toast("🎉 You won $0.50 credit balance!");
        closeP();
        renderSettings();
      };
    }
  }

  function openPayout() {
    let cards = []; try { cards = JSON.parse(localStorage.getItem("sokoni_cards_" + S.user.id) || "[]"); } catch (e) {}
    modal(`<h2>💳 Connect Card / Payout</h2>
      <div style="background:rgba(23,166,115,.12);border:1px solid #17a673;border-radius:10px;padding:10px;margin-bottom:12px;font-size:12px">
        <b>🛡️ Sokoni Trade Assurance</b><br>Supported: VISA · Mastercard · Airtel/MTN MoMo · PayPal
      </div>
      <b style="display:block;margin-bottom:8px">Saved Cards <button class="sec" style="padding:4px 10px" onclick="addCardModal()">＋ Add Card</button></b>
      ${cards.map((c, i) => `<div class="msg row" style="justify-content:space-between"><span>💳 ${esc(c.brand)} •••• ${esc(c.last4)} (${esc(c.exp)})</span><button class="dan" onclick="delCard(${i})">✕</button></div>`).join("") || `<p class="mu">No saved cards.</p>`}
      <button class="sec" style="width:100%;margin-top:14px" onclick="closeP()">Close</button>`);
  }

  function addCardModal() {
    const m = modal(`<h2>➕ Add Card</h2>
      <label>Cardholder Name</label><input id="cn" placeholder="Name">
      <label>Card Number</label><input id="cnum" maxlength="19" placeholder="4111 2222 3333 4444">
      <div class="row" style="gap:8px"><div style="flex:1"><label>Expiry</label><input id="cexp" maxlength="5" placeholder="MM/YY"></div><div style="flex:1"><label>CVV</label><input id="ccvv" maxlength="4" type="password" placeholder="123"></div></div>
      <div class="row" style="margin-top:12px"><button id="csave">Save</button><button class="sec" onclick="openPayout()">Cancel</button></div>`);
    m.querySelector("#csave").onclick = () => {
      const name = m.querySelector("#cn").value.trim(), num = m.querySelector("#cnum").value.replace(/\s+/g, ""), exp = m.querySelector("#cexp").value.trim();
      if (!name || num.length < 12) return alert("Enter valid card details.");
      let cards = []; try { cards = JSON.parse(localStorage.getItem("sokoni_cards_" + S.user.id) || "[]"); } catch (e) {}
      cards.push({ brand: num.startsWith("4") ? "VISA" : "Mastercard", last4: num.slice(-4), exp });
      localStorage.setItem("sokoni_cards_" + S.user.id, JSON.stringify(cards));
      toast("Card saved ✔"); openPayout();
    };
  }
  function delCard(i) {
    let cards = []; try { cards = JSON.parse(localStorage.getItem("sokoni_cards_" + S.user.id) || "[]"); } catch (e) {}
    cards.splice(i, 1); localStorage.setItem("sokoni_cards_" + S.user.id, JSON.stringify(cards)); openPayout();
  }

  // STRICT GIFT CARD VALIDATION (Checks Supabase `gift_cards` table + prevents empty/fake/duplicate codes)
  function openGift() {
    const m = modal(`<h2>🎁 Gift Cards</h2>
      <p class="mu">Enter a valid, unused gift card code to redeem funds.</p>
      <input id="gcode" placeholder="Enter gift card code" style="text-transform:uppercase">
      <div id="gerr" class="mu" style="color:#f85149;margin-bottom:10px;min-height:18px"></div>
      <button id="gredeem" style="width:100%">Verify &amp; Redeem Code</button>
      <button class="sec" style="width:100%;margin-top:8px" onclick="closeP()">Close</button>`);

    m.querySelector("#gredeem").onclick = async () => {
      const btn = m.querySelector("#gredeem");
      const errEl = m.querySelector("#gerr");
      const code = m.querySelector("#gcode").value.trim().toUpperCase();
      errEl.innerText = "";

      if (!code || code.length < 4) {
        errEl.innerText = "❌ Please enter a valid gift card code.";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Verifying code...";

      // Check local redeemed history first
      const usedKey = "sokoni_used_gifts_" + (S.user?.id || "guest");
      let usedCodes = [];
      try { usedCodes = JSON.parse(localStorage.getItem(usedKey) || "[]"); } catch (e) {}
      if (usedCodes.includes(code)) {
        errEl.innerText = "❌ This gift card code has already been redeemed.";
        btn.disabled = false;
        btn.innerText = "Verify & Redeem Code";
        return;
      }

      if (sb) {
        // Real Supabase database validation against `gift_cards` table
        try {
          const { data, error } = await sb
            .from("gift_cards")
            .select("*")
            .eq("code", code)
            .maybeSingle();

          if (error || !data) {
            errEl.innerText = "❌ Invalid gift card code. Please check and try again.";
            btn.disabled = false;
            btn.innerText = "Verify & Redeem Code";
            return;
          }
          if (data.redeemed || data.is_used) {
            errEl.innerText = "❌ This gift card has already been used.";
            btn.disabled = false;
            btn.innerText = "Verify & Redeem Code";
            return;
          }

          const amount = Number(data.amount || 0);
          if (amount <= 0) {
            errEl.innerText = "❌ Gift card has $0.00 balance.";
            btn.disabled = false;
            btn.innerText = "Verify & Redeem Code";
            return;
          }

          // Mark as redeemed in Supabase
          const { error: upErr } = await sb
            .from("gift_cards")
            .update({ redeemed: true, redeemed_by: S.user?.id || null, redeemed_at: new Date().toISOString() })
            .eq("id", data.id);

          if (upErr) {
            errEl.innerText = "❌ Error redeeming card: " + upErr.message;
            btn.disabled = false;
            btn.innerText = "Verify & Redeem Code";
            return;
          }

          usedCodes.push(code);
          localStorage.setItem(usedKey, JSON.stringify(usedCodes));
          S.credit += amount;
          saveCredit();
          toast(`🎉 Verified! +${usd(amount)} added to your balance`);
          closeP();
          renderSettings();
        } catch (err) {
          errEl.innerText = "❌ Verification failed. Try again.";
          btn.disabled = false;
          btn.innerText = "Verify & Redeem Code";
        }
      } else {
        // Offline/Demo validation: strictly rejects invalid codes; only accepts valid test codes if configured
        errEl.innerText = "❌ Invalid or unrecognized gift card code (Connect Supabase gift_cards table to verify live codes).";
        btn.disabled = false;
        btn.innerText = "Verify & Redeem Code";
      }
    };
  }

  function openOrders() {
    modal(`<h2>📦 Orders Dashboard</h2>
      <div class="msg"><b>Wireless Earbuds</b> ×1<div class="mu">$19.99 · Status: <span class="tag">Delivered</span></div></div>
      <div class="msg"><b>Smartwatch Series 8</b> ×1<div class="mu">$45.00 · Status: <span class="tag">Shipped</span></div></div>
      <button class="sec" style="width:100%;margin-top:12px" onclick="closeP()">Close</button>`);
  }

  function openListings() {
    modal(`<h2>🏷️ My Listings</h2>
      <div class="msg"><b>Vintage Denim Jacket</b><div class="mu">$28.00 · Status: Active</div></div>
      <button style="width:100%;margin-top:10px" onclick="go('post');closeP()">+ Post New Item</button>
      <button class="sec" style="width:100%;margin-top:8px" onclick="closeP()">Close</button>`);
  }

  function openSellerPlan() {
    modal(`<h2>👑 Seller Plan &amp; Upgrade</h2>
      <div class="panel"><b>Verified Seller Pro ($9.99/mo)</b><div class="mu">0% commission, featured badge, and priority search placement.</div><button style="width:100%;margin-top:10px" onclick="toast('Seller Pro activated ✔');closeP()">Upgrade Now</button></div>
      <button class="sec" style="width:100%" onclick="closeP()">Close</button>`);
  }

  function openCoupons() {
    modal(`<h2>🎟️ Coupons &amp; Browsing History</h2>
      <b style="display:block;margin-bottom:6px">Active Vouchers</b>
      <div class="msg"><b>SOKONI15</b> — 15% off your next checkout.</div>
      <b style="display:block;margin-top:14px;margin-bottom:6px">Recent History</b>
      <div class="mu">Your viewed items appear here automatically.</div>
      <button class="sec" style="width:100%;margin-top:14px" onclick="closeP()">Close</button>`);
  }

  function openAccountHelp() {
    modal(`<h2>⚙️ Account &amp; Help</h2>
      <p class="mu">Logged in as: <b>${esc(S.user?.email || "Member")}</b></p>
      <label>Display Name</label><input id="uname" value="${esc(uname())}">
      <button style="width:100%" onclick="toast('Profile updated ✔');closeP()">Save Changes</button>
      <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
      <button class="sec" style="width:100%;margin-bottom:8px" onclick="document.getElementById('support-modal').style.display='flex';closeP()">🎧 Sokoni Support</button>
      <button class="dan" style="width:100%" onclick="if(sb)sb.auth.signOut();S.user=null;closeP();renderSettings()">Log out</button>`);
  }

  function renderSettings() {
    $("#app").innerHTML = `
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">🛍️ Sokoni</h2>
        <div class="row" style="gap:6px">
          <button class="sec" style="padding:6px 10px;font-size:12px" onclick="toast('Inbox is empty')">✉️</button>
          <button class="sec" style="padding:6px 10px;font-size:12px" onclick="document.getElementById('support-modal').style.display='flex'">🎧</button>
          <button class="dan" style="padding:6px 10px;font-size:12px" onclick="if(sb)sb.auth.signOut();S.user=null;renderSettings()">Log out</button>
        </div>
      </div>

      <div class="panel">
        <div class="mu">Credit Balance</div>
        <div class="row" style="justify-content:space-between;margin-top:4px">
          <div class="price" style="font-size:28px">${usd(S.credit)}</div>
          <button onclick="withdrawNow()">Withdraw Funds</button>
        </div>
      </div>

      <div class="stats">
        <button class="sec" style="padding:18px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="openSpin()">
          <span style="font-size:26px">🎰</span>Daily Spin
        </button>
        <button class="sec" style="padding:18px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="openPayout()">
          <span style="font-size:26px">💳</span>Connect Card / Payout
        </button>
        <button class="sec" style="padding:18px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="openGift()">
          <span style="font-size:26px">🎁</span>Gift Cards
        </button>
        <button class="sec" style="padding:18px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="openOrders()">
          <span style="font-size:26px">📦</span>Orders
        </button>
        <button class="sec" style="padding:18px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="openListings()">
          <span style="font-size:26px">🏷️</span>My Listings
        </button>
        <button class="sec" style="padding:18px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="openSellerPlan()">
          <span style="font-size:26px">👑</span>Seller Plan
        </button>
        <button class="sec" style="padding:18px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="openCoupons()">
          <span style="font-size:26px">🎟️</span>Coupons &amp; History
        </button>
        <button class="sec" style="padding:18px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px" onclick="openAccountHelp()">
          <span style="font-size:26px">⚙️</span>Account &amp; Help
        </button>
      </div>`;
  }

  init();
</script>

<!-- Sokoni Support Modal -->
<div id="support-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; align-items:center; justify-content:center; padding:15px;">
  <div style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;width:100%;max-width:380px;padding:20px;position:relative;">
    <button onclick="document.getElementById('support-modal').style.display='none'" style="position:absolute; top:12px; right:14px; background:none; border:none; color:var(--text); font-size:22px; cursor:pointer;">&times;</button>
    <h3 style="margin-top:0; margin-bottom:6px; font-size:18px;">🎧 Sokoni Support</h3>
    <p style="font-size:13px; color:var(--mu); margin-top:0; margin-bottom:14px;">Get instant help with withdrawals, cards, and orders.</p>
    <input id="ai-q" placeholder="Type your question...">
    <button style="width:100%" onclick="const q=document.getElementById('ai-q').value.toLowerCase();document.getElementById('ai-reply').innerText=q.includes('with')?'🤖 Withdrawals are processed instantly via MoMo or bank transfer.':'🤖 Our support team is here to help 24/7!'">Ask AI</button>
    <p id="ai-reply" class="mu" style="margin-top:10px"></p>
  </div>
</div>

</body>
</html>
